name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Each OS runner builds its own CLI binary and packages its own native GUI with
# the `fyne` tool (.exe on Windows, .app on macOS, .tar.xz on Linux), because a
# Fyne GUI must be linked against the target OS's native graphics libraries.
jobs:
  build:
    name: package (${{ matrix.goos }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   arch: amd64 }
          - { os: macos-latest,   goos: darwin,  arch: arm64 }   # Apple Silicon
          - { os: windows-latest, goos: windows, arch: amd64 }
          # Intel macOS (macos-13/amd64) omitted: those runners queue
          # indefinitely and block the release. Intel Mac users can build from
          # source or run the CLI. Re-add once a runner is reliably available.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libxxf86vm-dev libwayland-dev

      # Raw go-build binaries (the exact commands CI validates on every OS). We
      # hand-assemble the macOS .app/.dmg below instead of using `fyne package`,
      # which SIGABRTs on macOS runners.
      - name: Build CLI + GUI binaries
        shell: bash
        run: |
          mkdir -p dist
          EXT=""; LDF=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; LDF="-H windowsgui"; fi
          VLD="-X github.com/bhargav/synckit/internal/version.Version=${GITHUB_REF_NAME}"
          BASE="${{ matrix.goos }}-${{ matrix.arch }}"
          go build -ldflags "$VLD" -o "dist/synckit-$BASE$EXT" ./cmd/synckit
          go build -ldflags "$VLD $LDF" -o "dist/synckit-gui-$BASE$EXT" ./cmd/synckit-gui

      # Hand-build synckit.app (Info.plist + .icns) and wrap it in a
      # drag-to-Applications .dmg. Unsigned: first launch needs right-click→Open.
      - name: Package macOS .app + .dmg
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          APP="build/synckit.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "dist/synckit-gui-darwin-${{ matrix.arch }}" "$APP/Contents/MacOS/synckit"
          chmod +x "$APP/Contents/MacOS/synckit"

          # icon.png -> icon.icns via the required iconset sizes
          mkdir icon.iconset
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz cmd/synckit-gui/icon.png --out "icon.iconset/icon_${sz}x${sz}.png" >/dev/null
            d=$((sz*2)); sips -z $d $d cmd/synckit-gui/icon.png --out "icon.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/icon.icns"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>CFBundleName</key><string>synckit</string>' \
            '<key>CFBundleDisplayName</key><string>synckit</string>' \
            '<key>CFBundleIdentifier</key><string>dev.bhargav.synckit</string>' \
            '<key>CFBundleExecutable</key><string>synckit</string>' \
            '<key>CFBundleIconFile</key><string>icon.icns</string>' \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            "<key>CFBundleVersion</key><string>${VER}</string>" \
            "<key>CFBundleShortVersionString</key><string>${VER}</string>" \
            '<key>LSMinimumSystemVersion</key><string>11.0</string>' \
            '<key>NSHighResolutionCapable</key><true/>' \
            '</dict></plist>' > "$APP/Contents/Info.plist"

          mkdir -p build/dmg
          cp -R "$APP" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "synckit" -srcfolder build/dmg -ov -format UDZO \
            "dist/synckit-macos-${{ matrix.arch }}.dmg"
          rm -rf build

      - uses: actions/upload-artifact@v4
        with:
          name: synckit-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
