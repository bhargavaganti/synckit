name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Each OS runner builds its own CLI binary and packages its own native GUI with
# the `fyne` tool (.exe on Windows, .app on macOS, .tar.xz on Linux), because a
# Fyne GUI must be linked against the target OS's native graphics libraries.
jobs:
  build:
    name: package (${{ matrix.goos }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  goos: linux,   arch: amd64 }
          - { os: macos-latest,   goos: darwin,  arch: arm64 }
          - { os: macos-13,       goos: darwin,  arch: amd64 }
          - { os: windows-latest, goos: windows, arch: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libxxf86vm-dev libwayland-dev

      # Ship raw go-build binaries (the exact commands CI validates on every OS).
      # `fyne package` is skipped for v0.x — it SIGABRTs on macOS runners and is
      # flaky on Linux; native .app/.dmg bundling is a later polish step.
      - name: Build CLI + GUI binaries
        shell: bash
        run: |
          mkdir -p dist
          EXT=""; LDF=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; LDF="-H windowsgui"; fi
          BASE="${{ matrix.goos }}-${{ matrix.arch }}"
          go build -o "dist/synckit-$BASE$EXT" ./cmd/synckit
          go build -ldflags "$LDF" -o "dist/synckit-gui-$BASE$EXT" ./cmd/synckit-gui

      - uses: actions/upload-artifact@v4
        with:
          name: synckit-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
