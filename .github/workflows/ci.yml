name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build and test on all three OSes. The GUI (Fyne) needs each OS's native
# graphics toolchain, so it can only be validated on its own runner — which is
# exactly why cross-compiling the GUI from one machine isn't possible.
jobs:
  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # Fyne's OpenGL/X11 bindings need these headers on Linux.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Vet
        run: go vet ./...

      - name: Build (CLI + GUI)
        run: go build ./...

      - name: Test
        run: go test ./...
