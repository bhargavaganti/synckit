name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build and test on all three OSes. The GUI (Fyne) needs each OS's native
# graphics toolchain, so it can only be validated on its own runner — which is
# exactly why cross-compiling the GUI from one machine isn't possible.
jobs:
  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # Fyne's OpenGL/X11 bindings need these headers on Linux.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libxxf86vm-dev libwayland-dev

      # Run each command capturing output; on failure emit the tail as a
      # ::error:: annotation (newlines -> %0A). Annotations render on the run
      # page and are readable without repo sign-in, unlike logs/summaries.
      - name: Build & test
        shell: bash
        run: |
          run() { echo "== $* =="; "$@"; }
          if ! {
            go env GOOS GOARCH CGO_ENABLED CC
            run go build ./cmd/synckit
            run go vet ./internal/...
            run go test ./internal/... -v
            run go build ./cmd/synckit-gui
          } > build.log 2>&1; then
            echo "===== build.log ====="; cat build.log
            MSG=$(tail -n 40 build.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$MSG"
            exit 1
          fi
          cat build.log
