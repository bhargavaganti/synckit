name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Build and test on all three OSes. The GUI (Fyne) needs each OS's native
# graphics toolchain, so it can only be validated on its own runner — which is
# exactly why cross-compiling the GUI from one machine isn't possible.
jobs:
  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # Fyne's OpenGL/X11 bindings need these headers on Linux.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libxxf86vm-dev libwayland-dev

      # Run everything under one shell, tracing each command and capturing all
      # output to build.log, which is uploaded as an artifact (publicly
      # downloadable) so failures are diagnosable without repo sign-in.
      - name: Build & test (captured)
        shell: bash
        run: |
          set -o pipefail
          {
            set -ex
            go env GOOS GOARCH CGO_ENABLED CC
            go build ./cmd/synckit
            go vet ./internal/...
            go test ./internal/... -v
            go build ./cmd/synckit-gui
          } 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ matrix.os }}
          path: build.log
